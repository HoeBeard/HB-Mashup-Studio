# Builds the free HB Mashup Studio installers for Windows and Mac.
# Run it from the "Actions" tab (Run workflow), or push a tag like v1.0.0
# to publish them on a GitHub Release page anyone can download from.
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never
      - name: Build Mac app
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --universal --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
